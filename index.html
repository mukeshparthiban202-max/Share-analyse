<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Share Valuation Dashboard</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0f172a, #1e293b);
      min-height: 100vh;
      color: white;
      padding: 20px;
    }

    .container {
      max-width: 1400px;
      margin: auto;
    }

    .title {
      text-align: center;
      margin-bottom: 25px;
    }

    .title h1 {
      font-size: 42px;
      font-weight: 700;
      background: linear-gradient(to right, #38bdf8, #22c55e);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .title p {
      margin-top: 10px;
      color: #cbd5e1;
      font-size: 16px;
    }

    .card {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px;
      padding: 25px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 30px rgba(0,0,0,0.3);
    }

    .table-container {
      overflow-x: auto;
      margin-top: 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 700px;
    }

    th {
      background: #0ea5e9;
      color: white;
      padding: 14px;
      font-size: 15px;
    }

    td {
      padding: 12px;
      text-align: center;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    tr:hover {
      background: rgba(255,255,255,0.05);
    }

    input {
      width: 100%;
      padding: 10px;
      border-radius: 10px;
      border: none;
      outline: none;
      background: rgba(255,255,255,0.1);
      color: white;
      text-align: center;
      font-size: 15px;
    }

    input::placeholder {
      color: #cbd5e1;
    }

    .button-section {
      margin-top: 30px;
      text-align: center;
    }

    button {
      background: linear-gradient(135deg, #06b6d4, #22c55e);
      border: none;
      padding: 15px 35px;
      color: white;
      font-size: 18px;
      border-radius: 15px;
      cursor: pointer;
      transition: 0.3s ease;
      font-weight: 700;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }

    button:hover {
      transform: translateY(-3px) scale(1.02);
    }

    .result-box {
      margin-top: 25px;
      text-align: center;
      padding: 20px;
      border-radius: 15px;
      font-size: 24px;
      font-weight: bold;
      display: none;
    }

    .undervalued {
      background: rgba(34,197,94,0.2);
      border: 1px solid #22c55e;
      color: #4ade80;
    }

    .overvalued {
      background: rgba(239,68,68,0.2);
      border: 1px solid #ef4444;
      color: #f87171;
    }

    .chart-card {
      margin-top: 30px;
    }

    canvas {
      margin-top: 20px;
      background: white;
      border-radius: 15px;
      padding: 15px;
    }

    .info-box {
      margin-top: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .mini-card {
      background: rgba(255,255,255,0.08);
      padding: 20px;
      border-radius: 15px;
      text-align: center;
    }

    .mini-card h3 {
      color: #38bdf8;
      margin-bottom: 10px;
      font-size: 18px;
    }

    .mini-card p {
      font-size: 28px;
      font-weight: bold;
    }

    @media(max-width: 768px) {
      .title h1 {
        font-size: 28px;
      }

      button {
        width: 100%;
      }

      .result-box {
        font-size: 20px;
      }
    }
  </style>
</head>
<body>

  <div class="container">

    <div class="title">
      <h1>Share Valuation Dashboard</h1>
      <p>Compare Share Price Growth vs Net Profit Growth</p>
    </div>

    <div class="card">

      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Year</th>
              <th>Share Price</th>
              <th>Net Profit</th>
            </tr>
          </thead>
          <tbody id="tableBody">
          </tbody>
        </table>
      </div>

      <div class="button-section">
        <button onclick="generateChart()">Generate Chart</button>
      </div>

      <div id="resultBox" class="result-box"></div>

      <div class="info-box">
        <div class="mini-card">
          <h3>Total Share Price</h3>
          <p id="totalShare">0</p>
        </div>

        <div class="mini-card">
          <h3>Total Net Profit</h3>
          <p id="totalProfit">0</p>
        </div>
      </div>

    </div>

    <div class="card chart-card">
      <canvas id="valuationChart"></canvas>
    </div>

  </div>

  <script>

    const tableBody = document.getElementById('tableBody');

    for(let i = 1; i <= 15; i++) {
      tableBody.innerHTML += `
        <tr>
          <td>Year ${i}</td>
          <td>
            <input type="number" class="sharePrice" placeholder="Enter Share Price">
          </td>
          <td>
            <input type="number" class="netProfit" placeholder="Enter Net Profit">
          </td>
        </tr>
      `;
    }

    let chart;

    function generateChart() {

      const shareInputs = document.querySelectorAll('.sharePrice');
      const profitInputs = document.querySelectorAll('.netProfit');

      const years = [];
      const sharePrices = [];
      const netProfits = [];

      shareInputs.forEach((input, index) => {
        years.push(`Year ${index + 1}`);
        sharePrices.push(Number(input.value) || 0);
      });

      profitInputs.forEach((input) => {
        netProfits.push(Number(input.value) || 0);
      });

      const totalSharePrice = sharePrices.reduce((a,b) => a+b, 0);
      const totalNetProfit = netProfits.reduce((a,b) => a+b, 0);

      document.getElementById('totalShare').innerText = totalSharePrice.toLocaleString();
      document.getElementById('totalProfit').innerText = totalNetProfit.toLocaleString();

      // BACKEND CALCULATION LIKE EXCEL
      // SHARE PRICE % = YEAR SHARE PRICE / TOTAL SHARE PRICE
      // NET PROFIT % = YEAR NET PROFIT / TOTAL NET PROFIT

      const sharePercentages = sharePrices.map(value => {
        return totalSharePrice === 0 ? 0 : ((value / totalSharePrice) * 100).toFixed(2);
      });

      const profitPercentages = netProfits.map(value => {
        return totalNetProfit === 0 ? 0 : ((value / totalNetProfit) * 100).toFixed(2);
      });

      // FINAL LOGIC
      // IF SHARE PRICE LINE ABOVE PROFIT LINE = OVERVALUED
      // IF SHARE PRICE LINE BELOW PROFIT LINE = UNDERVALUED

      const avgShare = sharePercentages.reduce((a,b)=> Number(a)+Number(b),0) / sharePercentages.length;

      const avgProfit = profitPercentages.reduce((a,b)=> Number(a)+Number(b),0) / profitPercentages.length;

      const resultBox = document.getElementById('resultBox');

      resultBox.style.display = 'block';

      if(avgShare > avgProfit) {
        resultBox.className = 'result-box overvalued';
        resultBox.innerHTML = 'Share looks OVERVALUED 📈';
      } else {
        resultBox.className = 'result-box undervalued';
        resultBox.innerHTML = 'Share looks UNDERVALUED 📉';
      }

      if(chart) {
        chart.destroy();
      }

      const ctx = document.getElementById('valuationChart').getContext('2d');

      chart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: years,
          datasets: [
            {
              label: 'Share Price %',
              data: sharePercentages,
              borderColor: '#ef4444',
              backgroundColor: '#ef4444',
              tension: 0.4,
              borderWidth: 4,
              pointRadius: 5
            },
            {
              label: 'Net Profit %',
              data: profitPercentages,
              borderColor: '#22c55e',
              backgroundColor: '#22c55e',
              tension: 0.4,
              borderWidth: 4,
              pointRadius: 5
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              labels: {
                color: 'black',
                font: {
                  size: 14,
                  weight: 'bold'
                }
              }
            },
            tooltip: {
              callbacks: {
                label: function(context) {
                  return context.dataset.label + ': ' + context.raw + '%';
                }
              }
            }
          },
          scales: {
            x: {
              ticks: {
                color: 'black'
              }
            },
            y: {
              ticks: {
                color: 'black'
              },
              title: {
                display: true,
                text: 'Percentage (%)',
                color: 'black',
                font: {
                  size: 16,
                  weight: 'bold'
                }
              }
            }
          }
        }
      });

      document.getElementById('valuationChart').style.height = '500px';
    }

  </script>

</body>
</html>
